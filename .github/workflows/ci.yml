name: CI Build & Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore tests/FinancialReconciliation.Tests/FinancialReconciliation.Tests.csproj
      
    - name: Run Unit Tests
      run: dotnet test tests/FinancialReconciliation.Tests/FinancialReconciliation.Tests.csproj --no-restore --verbosity normal
